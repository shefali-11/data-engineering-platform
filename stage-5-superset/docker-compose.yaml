services:
  superset:
    build: .
    container_name: stage5-superset
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home
    networks:
      - stage4-network
    command: >
      /bin/sh -c "
      superset db upgrade &&
      (superset fab create-admin
      --username admin
      --firstname Shefali
      --lastname Admin
      --email admin@example.com
      --password \"$$ADMIN_PASSWORD\" || true) &&
      superset init &&
      /usr/bin/run-server.sh
      "

volumes:
  superset_home:

networks:
  stage4-network:
    external: true
    name: stage-4-baserow_default