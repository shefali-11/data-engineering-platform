
services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: medallion-clickhouse
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse123
      CLICKHOUSE_DB: default
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user default --password clickhouse123 --query 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10

  nifi:
    image: apache/nifi:2.4.0
    container_name: medallion-nifi
    ports:
      - "8443:8443"
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: NiFiAdmin12345678
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - nifi_data:/opt/nifi/nifi-current/state

  postgres:
    image: postgres:16
    container_name: medallion-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow123
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow:
    image: medallion-airflow:3.3.2-dbt
    build: .
    container_name: medallion-airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__SECRET_KEY: "medallion-airflow-secret-key-change-me"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: "MedallionSharedJWTSecret2026-ChangeToLongRandomValue"
    ports:
      - "8082:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: >
      bash -c "airflow db migrate &&
      airflow api-server"
  airflow-scheduler:
    image: medallion-airflow:3.3.2-dbt
    build: .
    container_name: medallion-airflow-scheduler
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__SECRET_KEY: "medallion-airflow-secret-key-change-me"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: "MedallionSharedJWTSecret2026-ChangeToLongRandomValue"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: airflow scheduler

  airflow-dag-processor:
    image: medallion-airflow:3.3.2-dbt
    build: .
    container_name: medallion-airflow-dag-processor
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__SECRET_KEY: "medallion-airflow-secret-key-change-me"
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow:8080/execution/"
      AIRFLOW__API_AUTH__JWT_SECRET: "MedallionSharedJWTSecret2026-ChangeToLongRandomValue"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
    command: airflow dag-processor
volumes:
  clickhouse_data:
  nifi_data:
  postgres_data:
